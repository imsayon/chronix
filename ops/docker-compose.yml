name: chronix

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chronix
      POSTGRES_PASSWORD: chronix_dev
      POSTGRES_DB: chronix_dev
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chronix_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronix -d chronix_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ../server
      target: migration
    env_file: ${CHRONIX_ENV_FILE:-../server/.env}
    environment:
      DATABASE_URL: postgresql://chronix:chronix_dev@postgres:5432/chronix_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../server
      target: runtime
    env_file: ${CHRONIX_ENV_FILE:-../server/.env}
    environment:
      DATABASE_URL: postgresql://chronix:chronix_dev@postgres:5432/chronix_dev
      REDIS_URL: redis://valkey:6379
      CORS_ORIGIN: http://localhost:3001
      API_PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  scheduler:
    build:
      context: ../server
      target: runtime
    env_file: ${CHRONIX_ENV_FILE:-../server/.env}
    environment:
      DATABASE_URL: postgresql://chronix:chronix_dev@postgres:5432/chronix_dev
      REDIS_URL: redis://valkey:6379
      WORKER_ROLE: scheduler
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  executor:
    build:
      context: ../server
      target: runtime
    env_file: ${CHRONIX_ENV_FILE:-../server/.env}
    environment:
      DATABASE_URL: postgresql://chronix:chronix_dev@postgres:5432/chronix_dev
      REDIS_URL: redis://valkey:6379
      WORKER_ROLE: executor
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ../client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    environment:
      PORT: "3001"
    ports:
      - "${CLIENT_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chronix_pg_data:
