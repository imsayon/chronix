services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: chronix
            POSTGRES_PASSWORD: chronix_dev
            POSTGRES_DB: chronix_dev
        ports:
            - "5432:5432"
        volumes:
            - chronix_pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U chronix -d chronix_dev"]
            interval: 5s
            timeout: 5s
            retries: 5

    valkey:
        image: valkey/valkey:8-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    chronix_pg_data:
