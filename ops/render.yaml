services:
    # ─── API ─────────────────────────────────────────────────────────────────
    - type: web
      name: chronix-api
      env: node
      plan: starter
      rootDir: server
      buildCommand: pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm build
      startCommand: node dist/app.js
      healthCheckPath: /health/ready
      numInstances: 2
      autoDeploy: true
      envVarGroups:
          - ref: chronix-shared
          - ref: chronix-api

    # ─── Scheduler ───────────────────────────────────────────────────────────
    - type: worker
      name: chronix-scheduler
      env: node
      plan: starter
      rootDir: server
      buildCommand: pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm build
      startCommand: node dist/worker.js
      numInstances: 1
      autoDeploy: true
      envVarGroups:
          - ref: chronix-shared
          - ref: chronix-scheduler

    # ─── Worker ──────────────────────────────────────────────────────────────
    - type: worker
      name: chronix-worker
      env: node
      plan: starter
      rootDir: server
      buildCommand: pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm build
      startCommand: node dist/worker.js
      numInstances: 3
      autoDeploy: true
      envVarGroups:
          - ref: chronix-shared
          - ref: chronix-worker

    # ─── Next.js dashboard ───────────────────────────────────────────────────
    - type: web
      name: chronix-web
      env: node
      plan: starter
      rootDir: client
      buildCommand: pnpm install --frozen-lockfile && pnpm build
      startCommand: pnpm start
      healthCheckPath: /login
      numInstances: 1
      autoDeploy: true
      envVarGroups:
          - ref: chronix-web

# ─── Databases ─────────────────────────────────────────────────────────────
databases:
    - name: chronix-postgres
      plan: starter
      databaseName: chronix
      user: chronix

# ─── Redis / Valkey ────────────────────────────────────────────────────────
# Render Key Value (Valkey — Redis-compatible)
envVarGroups:
    - name: chronix-shared
      envVars:
          # Set these in the Render dashboard — not here
          - key: DATABASE_URL
            fromDatabase:
                name: chronix-postgres
                property: connectionString
          - key: NODE_ENV
            value: production
          - key: LOG_LEVEL
            value: info

    - name: chronix-api
      envVars:
          - key: API_PORT
            value: "3000"
          - key: ARGON2_MEMORY_COST
            value: "65536"
          # CORS_ORIGIN, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, REDIS_URL → set in dashboard

    - name: chronix-scheduler
      envVars:
          - key: WORKER_ROLE
            value: scheduler
          - key: SCHEDULER_TICK_MS
            value: "5000"
          - key: SCHEDULER_BATCH_SIZE
            value: "50"

    - name: chronix-worker
      envVars:
          - key: WORKER_ROLE
            value: executor
          - key: WORKER_CONCURRENCY
            value: "10"
          - key: LEASE_DURATION_MS
            value: "60000"

    - name: chronix-web
      envVars:
          - key: NEXT_PUBLIC_API_URL
            value: "https://chronix-api.onrender.com"
