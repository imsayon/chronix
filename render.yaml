services:
  - type: web
    name: chronix-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: corepack pnpm@11.21.0 install --prod=false --frozen-lockfile && corepack pnpm@11.21.0 build
    startCommand: corepack pnpm@11.21.0 migrate:deploy && node dist/app.js
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 300
    buildFilter:
      paths:
        - server/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: API_KEY_HMAC_SECRET
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: EMBEDDED_WORKERS
        value: "true"

  - type: web
    name: chronix-client
    runtime: node
    rootDir: client
    plan: free
    buildCommand: corepack pnpm@11.21.0 install --prod=false --frozen-lockfile && corepack pnpm@11.21.0 build
    startCommand: corepack pnpm@11.21.0 start
    healthCheckPath: /login
    buildFilter:
      paths:
        - client/**
        - render.yaml
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
